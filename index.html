<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Masterpiece Mansion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#235f62;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Helvetica Neue',sans-serif;}

#stage{position:relative;width:100vw;max-width:478px;}
#stage svg{width:100%;height:auto;display:block;}

/* 空き室：#666161（SVGデフォルト）、入居者：黄色 */
.win-occupied{fill:#f5c842 !important;}
.win-hover{fill:#f5d442 !important;cursor:pointer;}

/* モーダル */
#overlay{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(0,0,0,0);}
#overlay.open{display:flex;animation:fadeOverlay 0.3s ease forwards;}
@keyframes fadeOverlay{to{background:rgba(0,0,0,0.7);}}
#mbox{background:#fff;border-radius:16px;width:min(520px,94vw);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,0.4);opacity:0;transform:translateY(12px);transition:opacity 0.3s ease,transform 0.3s ease;}
#overlay.open #mbox{opacity:1;transform:translateY(0);}
#mbody{overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
#mbody-img{width:100%;background:#111;flex-shrink:0;position:relative;}
#mbody-img img{width:100%;max-height:320px;object-fit:contain;display:block;background:#f0f0f0;}
#mbody-img .no-img{display:none;}
#room-number-overlay{
  position:absolute;
  top:14px;
  left:16px;
  font-size:28px;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);
  letter-spacing:0.02em;
  pointer-events:none;
}
#mclose{
  position:absolute;
  top:10px;
  right:10px;
  width:30px;height:30px;
  border-radius:50%;
  border:none;
  background:rgba(0,0,0,0.4);
  cursor:pointer;
  font-size:14px;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
#mclose:hover{background:rgba(0,0,0,0.6);}
#mbody-info{padding:20px;}
.cs{margin-bottom:18px;}
.csh{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.bio{font-size:13px;color:#333;line-height:1.7;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{background:#f0f0f0;color:#555;font-size:12px;padding:3px 10px;border-radius:20px;}
.links{display:flex;flex-direction:column;gap:7px;}
.lnk{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8f8f8;border-radius:8px;text-decoration:none;color:#333;font-size:13px;}
.lnk:hover{background:#eee;}
.lnk-i{font-size:15px;width:18px;text-align:center;}

/* LIVE バッジ */
#live-badge{display:none;position:fixed;top:16px;right:16px;background:#f5c842;color:#191818;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:200;}

/* 新入居通知 */
#new-notice{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5c842;color:#191818;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.3);}

/* 吹き出しツールチップ */
#tooltip{
  display:none;
  position:fixed;
  pointer-events:none;
  z-index:300;
  transform:translate(-50%, -100%);
  margin-top:-8px;
  width:72px;
  text-align:center;
  opacity:0;
  transition:opacity 0.2s ease;
}
#tooltip.show{opacity:1;}
#tooltip svg{
  width:100%;
  height:auto;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}
#tooltip-text{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:10px;
  font-weight:700;
  color:#191818;
  white-space:nowrap;
}
</style>
</head>
<body>

<div id="stage"></div>

<div id="overlay">
  <div id="mbox">
    <div id="mbody">
      <div id="mbody-img">
        <span class="no-img"></span>
        <div id="room-number-overlay"></div>
        <button id="mclose">✕</button>
      </div>
      <div id="mbody-info">
        <div id="creator-content"></div>
      </div>
    </div>
  </div>
</div>

<div id="live-badge">● LIVE（5秒更新）</div>
<div id="new-notice">✨ 新しいクリエイターが入居しました！</div>
<div id="tooltip">
  <svg enable-background="new 0 0 800 574.943" viewBox="0 0 800 574.943" xmlns="http://www.w3.org/2000/svg"><path d="m264.156 445.155s35.975.445 74.477.615c-12.329 50.563-42.204 114.8-42.204 114.8s64.604-56.112 99.22-114.858c10.81-.104 19.97-.279 26.197-.557 216.944-9.641 395.361-194.394 351.466-326.08-34.703-104.11-308.644-137.234-554.964-68.978-246.322 68.254-297.861 376.246 45.808 395.058z" fill="#fff"/></svg>
  <span id="tooltip-text"></span>
</div>

<script>
(function(){

var GAS_URL   = 'https://script.google.com/macros/s/AKfycbzmSfRX1jtODBrEryweDGhSm26YkrmeqoSaS_CJ0j-NxGUoRchOCwJiRTS_TPL6iNJw1A/exec';
var GAS_TOKEN = 'mpm-secret-2026';
var roomData  = {};
var firstLoad = true;

// SVGをfetchして埋め込む
fetch('mansion_new.svg')
  .then(function(r){ return r.text(); })
  .then(function(svgText){
    document.getElementById('stage').innerHTML = svgText;
    initWindows();
    startPolling();
  });

function initWindows(){
  var tooltip = document.getElementById('tooltip');
  var wins = document.querySelectorAll('[id^="win-"]');
  wins.forEach(function(el){
    var roomNum = el.id.replace('win-', '');
    if(roomNum.indexOf('side') !== -1) return;
    el.style.cursor = 'default';

    el.addEventListener('mouseenter', function(e){
      if(el.classList.contains('win-occupied')){
        el.classList.add('win-hover');
        document.getElementById('tooltip-text').textContent = roomNum + '号室';
        tooltip.style.display = 'block';
        setTimeout(function(){ tooltip.classList.add('show'); }, 10);
      }
    });
    el.addEventListener('mousemove', function(e){
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top  = (e.clientY - 8) + 'px';
    });
    el.addEventListener('mouseleave', function(){
      el.classList.remove('win-hover');
      tooltip.classList.remove('show');
      setTimeout(function(){ tooltip.style.display = 'none'; }, 200);
    });
    el.addEventListener('click', function(){
      if(el.classList.contains('win-occupied')){
        openModal(roomNum);
      }
    });
  });
}

function applyOccupancy(){
  var wins = document.querySelectorAll('[id^="win-"]');
  wins.forEach(function(el){
    var roomNum = el.id.replace('win-', '');
    // 側面窓はスキップ（後で処理）
    if(roomNum.indexOf('side') !== -1) return;
    if(roomData[roomNum]){
      el.classList.add('win-occupied');
      el.style.cursor = 'pointer';
    } else {
      el.classList.remove('win-occupied');
      el.style.cursor = 'default';
    }
  });

  // 側面窓：x01部屋に入居者がいれば同じ階の側面も黄色に
  for(var floor = 1; floor <= 9; floor++){
    var roomNum = String(floor * 100 + 1); // 101, 201, ...901
    var occupied = !!roomData[roomNum];
    var sideA = document.getElementById('win-side-A-' + floor);
    var sideB = document.getElementById('win-side-B-' + floor);
    if(sideA){ if(occupied){ sideA.classList.add('win-occupied'); } else { sideA.classList.remove('win-occupied'); } }
    if(sideB){ if(occupied){ sideB.classList.add('win-occupied'); } else { sideB.classList.remove('win-occupied'); } }
  }
}

function loadRoomData(){
  fetch(GAS_URL + '?token=' + GAS_TOKEN)
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var newData = {};
      rows.forEach(function(row){
        var n = String(row['部屋番号']||'').trim();
        if(n) newData[n] = row;
      });
      var hasNew = !firstLoad && Object.keys(newData).some(function(n){ return !roomData[n]; });
      roomData = newData;
      firstLoad = false;
      applyOccupancy();
      if(hasNew) showNotice();
    })
    .catch(function(){ applyOccupancy(); });
}

function showNotice(){
  var el = document.getElementById('new-notice');
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(function(){
    el.style.transition = 'opacity 1.5s';
    el.style.opacity = '0';
    setTimeout(function(){ el.style.display='none'; el.style.transition=''; }, 1600);
  }, 3000);
}

var isLive = window.location.search.indexOf('live=true') !== -1;
var POLL   = isLive ? 5000 : 300000;

function startPolling(){
  loadRoomData();
  setInterval(loadRoomData, POLL);
  if(isLive) document.getElementById('live-badge').style.display = 'block';
}

// モーダル
function toDriveImg(url, sz){
  // GASがBase64で返すのでそのまま使用
  return url || '';
}

function initAvatar(name){
  var el = document.getElementById('mhead-avatar');
  var cv = document.createElement('canvas'); cv.width=96; cv.height=96;
  var ctx = cv.getContext('2d');
  ctx.fillStyle='#e0e8f0'; ctx.beginPath(); ctx.arc(48,48,48,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5577aa'; ctx.font='bold 36px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText((name||'?').charAt(0), 48, 50);
  el.src = cv.toDataURL(); el.style.display='block';
}

function openModal(roomNum){
  var cr = roomData[roomNum] || null;
  var floor = Math.floor(parseInt(roomNum)/100);
  var unit  = parseInt(roomNum) % 100;
  var tier  = floor < 4 ? '低層' : floor < 7 ? '中層' : '高層';

  // 画像
  var imgCol = document.getElementById('mbody-img');
  if(cr && cr['MasterPiece画像']){
    imgCol.innerHTML = '<img src="'+cr['MasterPiece画像']+'" alt="作品画像">';
  } else {
    imgCol.innerHTML = '';
  }

  // 画像の上に部屋番号を大きく表示
  document.getElementById('room-number-overlay').textContent = roomNum + '号室';

  var h = '';
  if(cr){
    // 作品名・作者・制作年
    var meta = '';
    if(cr['MasterPiece名']) meta += '<div style="font-size:20px;font-weight:700;color:#111;margin-bottom:4px;">'+cr['MasterPiece名']+'</div>';
    if(cr['作者'] || cr['制作年']){
      meta += '<div style="font-size:13px;color:#888;margin-bottom:16px;">';
      if(cr['作者']) meta += cr['作者'];
      if(cr['制作年']) meta += (cr['作者'] ? ' · ' : '') + cr['制作年'];
      meta += '</div>';
    }
    h += meta;
    // 作品概要
    if(cr['作品概要']){
      h += '<div class="cs"><div class="csh">作品概要</div><p class="bio">'+cr['作品概要']+'</p></div>';
    }
    // 自己紹介
    if(cr['自己紹介']){
      h += '<div class="cs"><div class="csh">作者について</div><p class="bio">'+cr['自己紹介']+'</p></div>';
    }
    // リンク
    var ls = [];
    if(cr['URL'])             ls.push({i:'🎨', l:'作品URL',      u: cr['URL']});
    if(cr['SNS：Instagram'])  ls.push({i:'📷', l:'Instagram',    u: 'https://instagram.com/'+cr['SNS：Instagram'].replace('@','')});
    if(cr['SNS：Twitter'])    ls.push({i:'🐦', l:'Twitter / X', u: 'https://twitter.com/'+cr['SNS：Twitter'].replace('@','')});
    if(cr['SNS：other'])      ls.push({i:'🔗', l:'その他SNS',   u: cr['SNS：other']});
    if(ls.length){
      h += '<div class="cs"><div class="csh">リンク</div><div class="links">';
      ls.forEach(function(lk){ h += '<a class="lnk" href="'+lk.u+'" target="_blank" rel="noopener"><span class="lnk-i">'+lk.i+'</span>'+lk.l+'</a>'; });
      h += '</div></div>';
    }
    // Discord
    if(cr['Discord name']){
      h += '<div class="cs"><div class="csh">Discord</div><p class="bio">'+cr['Discord name']+'</p></div>';
    }
  } else {
    h = '<div style="text-align:center;padding:40px;color:#aaa"><div style="font-size:48px;margin-bottom:12px">🚪</div><p>現在入居者募集中</p></div>';
  }
  document.getElementById('creator-content').innerHTML = h;
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('mclose').addEventListener('click', function(){ document.getElementById('overlay').classList.remove('open'); });
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('overlay').classList.remove('open'); });

})();
</script>
</body>
</html>
