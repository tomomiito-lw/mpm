<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Masterpiece Mansion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'BricolageAlphaNum';
  src: local('Bricolage Grotesque');
  unicode-range: U+0020-007E;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#235f62;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'BricolageAlphaNum','Bricolage Grotesque','Helvetica Neue',sans-serif;}

/* ─── ローディングオーバーレイ ─── */
#loader{
  position:fixed;inset:0;z-index:500;
  background:#235f62;
  pointer-events:none;
  transition:opacity 0.6s ease;
}
#loader.done{opacity:0;}

/* ロゴ（左からフェードイン） */
#intro-logo{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:501;
  color:#fff;
  font-family:'BricolageAlphaNum','Bricolage Grotesque','Helvetica Neue',sans-serif;
  font-weight:900;
  line-height:1.05;
  font-size:clamp(44px,12vw,80px);
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
}

/* ─── SVGの月・ビルアニメーション ─── */
#stage{position:relative;width:100vw;max-width:478px;opacity:0;}
#stage.visible{opacity:1;}
#stage svg{width:100%;height:auto;display:block;}

/* 月：左から外れた位置からスライドイン */
#stage .anim-moon{
  transform:translateX(-200px);
  transition:transform 1.6s cubic-bezier(0.25,0.46,0.45,0.94);
}
#stage.anim-moon-in .anim-moon{
  transform:translateX(0);
}

/* 空き室：#666161（SVGデフォルト）、入居者：黄色 */
.win-occupied{fill:#f5c842 !important;}
.win-hover{fill:#f5d442 !important;cursor:pointer;}

/* モーダル */
#overlay{display:none;position:fixed;inset:0;z-index:600;align-items:center;justify-content:center;background:rgba(0,0,0,0);}
#overlay.open{display:flex;animation:fadeOverlay 0.3s ease forwards;}
@keyframes fadeOverlay{to{background:rgba(0,0,0,0.7);}}
#mbox{background:#fff;border-radius:16px;width:min(520px,94vw);max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,0.4);opacity:0;transform:translateY(12px);transition:opacity 0.3s ease,transform 0.3s ease;}
#overlay.open #mbox{opacity:1;transform:translateY(0);}
#mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #eee;flex-shrink:0;background:#fff;}
#mhead-left{display:flex;align-items:center;gap:12px;}
#mhead-room-label{font-size:11px;font-weight:700;color:#111;line-height:1.4;}
#mhead-room{font-size:56px;font-weight:900;color:#111;line-height:1;letter-spacing:-0.02em;}
@media (max-width:600px){#mhead-room{font-size:48px;}}
#mhead-right{display:flex;flex-direction:column;align-items:center;gap:4px;}
#mclose{background:#111;color:#fff;border:none;border-radius:100px;padding:8px 20px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.05em;}
#mclose:hover{background:#333;}
#mclose-sub{font-size:11px;font-weight:700;color:#111;}
#mbody{overflow-y:auto;display:flex;flex-direction:column;min-height:0;}
#mbody-img{width:100%;background:#000;flex-shrink:0;position:relative;}
#room-svg-container{width:100%;display:block;}
#room-svg-container svg{width:100%;height:auto;display:block;}
#room-number-overlay{display:none;}
#mbody-info{padding:20px;}
.cs{margin-bottom:18px;}
.csh{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.bio{font-size:13px;color:#333;line-height:1.7;font-weight:700;}
.tags{display:flex;flex-wrap:wrap;gap:5px;}
.tag{background:#f0f0f0;color:#555;font-size:12px;padding:3px 10px;border-radius:20px;}
.links{display:flex;flex-direction:column;gap:7px;}
.lnk{display:flex;align-items:center;gap:9px;padding:9px 13px;background:#f8f8f8;border-radius:8px;text-decoration:none;color:#333;font-size:13px;}
.lnk:hover{background:#eee;}
.lnk-i{font-size:15px;width:18px;text-align:center;}

/* LIVE バッジ */
#live-badge{display:none;position:fixed;top:16px;right:16px;background:#f5c842;color:#191818;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;z-index:200;}

/* 新入居通知 */
#new-notice{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5c842;color:#191818;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,0.3);}

/* 吹き出しツールチップ */
#tooltip{
  display:none;
  position:fixed;
  pointer-events:none;
  z-index:300;
  transform:translate(-50%, -100%);
  margin-top:-8px;
  width:72px;
  text-align:center;
  opacity:0;
  transition:opacity 0.2s ease;
}
#tooltip.show{opacity:1;}
#tooltip svg{
  width:100%;
  height:auto;
  display:block;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));
}
#tooltip-text{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:10px;
  font-weight:700;
  color:#191818;
  white-space:nowrap;
}
</style>
</head>
<body>

<!-- ローディングオーバーレイ -->
<div id="loader"></div>
<!-- イントロロゴ -->
<div id="intro-logo">The<br>Masterpiece<br>Mansion</div>

<div id="stage"></div>

<div id="overlay">
  <div id="mbox">
    <div id="mhead">
      <div id="mhead-left">
        <div id="mhead-room-label">Room<br>No.</div>
        <div id="mhead-room"></div>
      </div>
      <div id="mhead-right">
        <button id="mclose">EXIT</button>
        <div id="mclose-sub">お邪魔しました！</div>
      </div>
    </div>
    <div id="mbody">
      <div id="mbody-img">
        <div id="room-number-overlay"></div>
        <div id="room-svg-container"></div>
      </div>
      <div id="mbody-info">
        <div id="creator-content"></div>
      </div>
    </div>
  </div>
</div>

<div id="live-badge">● LIVE（5秒更新）</div>
<div id="new-notice">✨ 新しいクリエイターが入居しました！</div>
<div id="tooltip">
  <svg enable-background="new 0 0 800 574.943" viewBox="0 0 800 574.943" xmlns="http://www.w3.org/2000/svg"><path d="m264.156 445.155s35.975.445 74.477.615c-12.329 50.563-42.204 114.8-42.204 114.8s64.604-56.112 99.22-114.858c10.81-.104 19.97-.279 26.197-.557 216.944-9.641 395.361-194.394 351.466-326.08-34.703-104.11-308.644-137.234-554.964-68.978-246.322 68.254-297.861 376.246 45.808 395.058z" fill="#fff"/></svg>
  <span id="tooltip-text"></span>
</div>

<script>
(function(){

var GAS_URL   = 'https://script.google.com/macros/s/AKfycbykg7K-kfu1jeo2K6N0hlqXOXFCpKf2KXwdHWG2bQv7jhOvgVI8nfQONLdGT_Lt5GKoVQ/exec';
var GAS_TOKEN = 'mpm-secret-2026';
var roomData  = {};
var firstLoad = true;

// SVGをfetchして埋め込む
fetch('mansion_new.svg')
  .then(function(r){ return r.text(); })
  .then(function(svgText){
    document.getElementById('stage').innerHTML = svgText;
    // 月の要素にクラスを付与
    var moon = document.querySelector('#stage .cls-2');
    if(moon) moon.classList.add('anim-moon');
    // ビル（cls-3）に初期非表示
    var building = document.querySelector('#stage .cls-3');
    if(building) building.style.opacity = '0';
      // SVGのロゴテキスト（cls-4グループ）を初期非表示
      var svgLogoGroups = document.querySelectorAll('#stage .cls-4');
      svgLogoGroups.forEach(function(g){ g.style.opacity='0'; });
    initWindows();
    startPolling();
    runIntroAnimation();
  });

function runIntroAnimation(){
  var logo    = document.getElementById('intro-logo');
  var loader  = document.getElementById('loader');
  var stage   = document.getElementById('stage');
  var building= document.querySelector('#stage .cls-3');
  var moon    = document.querySelector('#stage .anim-moon');

  // STEP1: 緑の画面（1.0秒待機）
  setTimeout(function(){

    // STEP2: ロゴが左からフェードイン（1.4秒）
    logo.style.transition = 'opacity 2.8s ease, transform 2.8s ease';
    logo.style.transform  = 'translate(-50%,-50%)';
    logo.style.opacity    = '1';

    setTimeout(function(){

      // STEP3: ビルを表示、ロゴが定位置に縮小
      var stageEl  = stage.getBoundingClientRect();
      var scaleX   = stageEl.width  / 478.8;
      var scaleY   = stageEl.height / 801.28;
      var svgLogoX = 30, svgLogoY = 30;
      var logoTargX = stageEl.left + svgLogoX * scaleX;
      var logoTargY = stageEl.top  + svgLogoY * scaleY - 8;
      var vpCX = window.innerWidth  / 2;
      var vpCY = window.innerHeight / 2;
      var logoEl   = logo;
      var logoW    = logoEl.offsetWidth;
      var logoH    = logoEl.offsetHeight;
      var scale    = Math.min(stageEl.width / 478.8, 1) * 0.48;
      var scaledW  = logoW * scale;
      var scaledH  = logoH * scale;
      var targetCX = logoTargX + scaledW / 2;
      var targetCY = logoTargY + scaledH / 2;
      var dx = targetCX - vpCX;
      var dy = targetCY - vpCY;

      stage.style.opacity = '1';

      logo.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
      logo.style.transform  = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px)) scale('+scale+')';

      // ロゴ移動開始と同時にビルをフェードイン
      setTimeout(function(){
        if(building){ building.style.transition='opacity 0.8s ease'; building.style.opacity='1'; }
      }, 300);

      setTimeout(function(){
        // SVGのロゴはそのまま非表示のまま
        // オーバーレイロゴが定位置に残る

        // STEP4: 月がビルの裏からスライドイン
        setTimeout(function(){
          stage.classList.add('anim-moon-in');
          setTimeout(function(){
            // ローダーフェードアウト前にロゴをbodyに移動して残す
            document.body.appendChild(logo);
            loader.classList.add('done');
          }, 1200);
        }, 300);

      }, 1200);  // ロゴ移動完了まで待機

    }, 3200);    // STEP2ロゴ表示の尺

  }, 1000);      // STEP1 緑の画面待機
}

function hideLoader(){
  // GASデータ取得完了 → 特に何もしない（アニメーションは独立）
}

// タッチデバイスではツールチップ無効
var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function initWindows(){
  var tooltip = document.getElementById('tooltip');
  var wins = document.querySelectorAll('[id^="win-"]');
  wins.forEach(function(el){
    var roomNum = el.id.replace('win-', '');
    if(roomNum.indexOf('side') !== -1) return;
    el.style.cursor = 'default';

    if(!isTouch){
      el.addEventListener('mouseenter', function(e){
        if(el.classList.contains('win-occupied')){
          el.classList.add('win-hover');
          document.getElementById('tooltip-text').textContent = roomNum + '号室';
          tooltip.style.display = 'block';
          setTimeout(function(){ tooltip.classList.add('show'); }, 10);
        }
      });
      el.addEventListener('mousemove', function(e){
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top  = (e.clientY - 8) + 'px';
      });
      el.addEventListener('mouseleave', function(){
        el.classList.remove('win-hover');
        tooltip.classList.remove('show');
        setTimeout(function(){ tooltip.style.display = 'none'; }, 200);
      });
    }

    el.addEventListener('click', function(){
      if(el.classList.contains('win-occupied')){
        openModal(roomNum);
      }
    });
  });
}

function applyOccupancy(){
  var wins = document.querySelectorAll('[id^="win-"]');
  wins.forEach(function(el){
    var roomNum = el.id.replace('win-', '');
    // 側面窓はスキップ（後で処理）
    if(roomNum.indexOf('side') !== -1) return;
    if(roomData[roomNum]){
      el.classList.add('win-occupied');
      el.style.cursor = 'pointer';
    } else {
      el.classList.remove('win-occupied');
      el.style.cursor = 'default';
    }
  });

  // 側面窓：x01部屋に入居者がいれば同じ階の側面も黄色に
  for(var floor = 1; floor <= 9; floor++){
    var roomNum = String(floor * 100 + 1); // 101, 201, ...901
    var occupied = !!roomData[roomNum];
    var sideA = document.getElementById('win-side-A-' + floor);
    var sideB = document.getElementById('win-side-B-' + floor);
    if(sideA){ if(occupied){ sideA.classList.add('win-occupied'); } else { sideA.classList.remove('win-occupied'); } }
    if(sideB){ if(occupied){ sideB.classList.add('win-occupied'); } else { sideB.classList.remove('win-occupied'); } }
  }
}

function loadRoomData(){
  fetch(GAS_URL + '?token=' + GAS_TOKEN)
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var newData = {};
      rows.forEach(function(row){
        var n = String(row['部屋番号']||'').trim();
        if(n) newData[n] = row;
      });
      var hasNew = !firstLoad && Object.keys(newData).some(function(n){ return !roomData[n]; });
      roomData = newData;
      firstLoad = false;
      applyOccupancy();
      if(hasNew) showNotice();
      hideLoader();
    })
    .catch(function(){
      firstLoad = false;
      applyOccupancy();
      hideLoader();
    });
}

function showNotice(){
  var el = document.getElementById('new-notice');
  el.style.display = 'block';
  el.style.opacity = '1';
  setTimeout(function(){
    el.style.transition = 'opacity 1.5s';
    el.style.opacity = '0';
    setTimeout(function(){ el.style.display='none'; el.style.transition=''; }, 1600);
  }, 3000);
}

var isLive = window.location.search.indexOf('live=true') !== -1;
var POLL   = isLive ? 5000 : 300000;

function startPolling(){
  loadRoomData();
  setInterval(loadRoomData, POLL);
  if(isLive) document.getElementById('live-badge').style.display = 'block';
}

// モーダル
function toDriveImg(url, sz){
  // GASがBase64で返すのでそのまま使用
  return url || '';
}

function initAvatar(name){
  var el = document.getElementById('mhead-avatar');
  var cv = document.createElement('canvas'); cv.width=96; cv.height=96;
  var ctx = cv.getContext('2d');
  ctx.fillStyle='#e0e8f0'; ctx.beginPath(); ctx.arc(48,48,48,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#5577aa'; ctx.font='bold 36px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText((name||'?').charAt(0), 48, 50);
  el.src = cv.toDataURL(); el.style.display='block';
}

function openModal(roomNum){
  var cr = roomData[roomNum] || null;
  var floor = Math.floor(parseInt(roomNum)/100);
  var unit  = parseInt(roomNum) % 100;
  var tier  = floor < 4 ? '低層' : floor < 7 ? '中層' : '高層';

  // ヘッダーに部屋番号
  document.getElementById('mhead-room').textContent = roomNum;

  // 部屋SVGに作品画像を埋め込む
  var roomContainer = document.getElementById('room-svg-container');
  var imgSrc = (cr && cr['MasterPiece画像']) ? cr['MasterPiece画像'] : '';

  // 作品エリア：横幅固定(660px)、縦は画像に合わせて可変
  // SVGのviewBoxは動的に設定する
  var wallX = 203, wallW = 862; // 壁の横範囲
  var artX = 303, artW = 662;
  var artY = 120, artPad = 10;

  if(imgSrc){
    var img = new Image();
    img.onload = function(){
      var ratio = img.naturalHeight / img.naturalWidth;
      var maxW = 662, maxH = 500;
      var artW2 = maxW, artH2 = Math.round(maxW * ratio);
      if(artH2 > maxH){
        artH2 = maxH;
        artW2 = Math.round(maxH / ratio);
      }
      // 壁エリア：x 203〜1065（幅862）、y 0〜640（床まで）
      var wallCenterX = (203 + 1065) / 2;
      var wallCenterY = 640 / 2;
      var artX2 = Math.round(wallCenterX - artW2 / 2);
      var artY2 = Math.round(wallCenterY - artH2 / 2);
      renderRoomSVG(roomContainer, imgSrc, artX2, artY2, artW2, artH2, 720);
    };
    img.onerror = function(){
      var artX2 = Math.round((203 + 1065) / 2 - 331);
      var artY2 = Math.round(640 / 2 - 225);
      renderRoomSVG(roomContainer, imgSrc, artX2, artY2, 662, 450, 720);
    };
    img.src = imgSrc;
  } else {
    var artX2 = Math.round((203 + 1065) / 2 - 331);
    var artY2 = Math.round(640 / 2 - 225);
    renderRoomSVG(roomContainer, '', artX2, artY2, 662, 450, 720);
  }

  _openModalInfo(cr, roomNum);
}

function renderRoomSVG(container, imgSrc, artX, artY, artW, artH, svgH){
  var pad = 10;
  var leftW = 203, rightStart = 1065, totalW = 1270;
  var floorY = svgH - 80;
  var bx = artX - pad, by = artY - pad, bw = artW + pad*2, bh = artH + pad*2;

  var s = '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 '+totalW+' '+svgH+'">'
    + '<defs><style>.r1{fill:#fff}.r2{fill:#ffffa0}</style></defs>'
    + '<rect class="r1" x="0" y="0" width="'+totalW+'" height="'+svgH+'"/>'
    + '<rect x="0" y="0" width="'+totalW+'" height="'+svgH+'" fill="none" stroke="#000" stroke-width="5.67"/>'
    + '<polygon points="'+totalW+' '+svgH+' '+rightStart+' '+floorY+' '+leftW+' '+floorY+' 0 '+svgH+'"/>'
    + '<polygon class="r2" points="0 '+svgH+' 0 0 '+leftW+' 0 '+leftW+' '+floorY+'"/>'
    + '<rect x="0" y="0" width="'+leftW+'" height="'+svgH+'" fill="none" stroke="#000" stroke-width="5.67"/>'
    + '<polygon class="r2" points="'+totalW+' '+svgH+' '+totalW+' 0 '+rightStart+' 0 '+rightStart+' '+floorY+'"/>'
    + '<rect x="'+rightStart+'" y="0" width="'+(totalW-rightStart)+'" height="'+svgH+'" fill="none" stroke="#000" stroke-width="5.67"/>'
    + '<rect x="'+bx+'" y="'+by+'" width="'+bw+'" height="'+bh+'" fill="#fff" stroke="#000" stroke-width="3"/>';

  if(imgSrc){
    s += '<image href="'+imgSrc+'" x="'+artX+'" y="'+artY+'" width="'+artW+'" height="'+artH+'" preserveAspectRatio="xMidYMid meet"/>';
  } else {
    s += '<text x="'+(artX+artW/2)+'" y="'+(artY+artH/2)+'" fill="#aaa" font-size="36" text-anchor="middle" dominant-baseline="middle">No Image</text>';
  }
  s += '</svg>';
  container.innerHTML = s;
}

function _openModalInfo(cr, roomNum){
  var h = '';
  if(cr){
    if(cr['MasterPiece名']) h += '<div class="cs"><div class="csh">MasterPiece名</div><p class="bio" style="font-size:18px;font-weight:700;color:#111;">'+cr['MasterPiece名']+'</p></div>';
    if(cr['作者'])          h += '<div class="cs"><div class="csh">作者</div><p class="bio">'+cr['作者']+'</p></div>';
    if(cr['制作年'])        h += '<div class="cs"><div class="csh">制作年</div><p class="bio">'+cr['制作年']+'</p></div>';
    if(cr['セールスポイント']) h += '<div class="cs"><div class="csh">セールスポイント</div><p class="bio">'+cr['セールスポイント']+'</p></div>';
    var ls = [];
    if(cr['URL'])             ls.push({i:'🎨', l:'URL',            u: cr['URL']});
    if(cr['SNS：Instagram'])  ls.push({i:'📷', l:'SNS：Instagram', u: 'https://instagram.com/'+cr['SNS：Instagram'].replace('@','')});
    if(cr['SNS：Twitter'])    ls.push({i:'🐦', l:'SNS：Twitter',   u: 'https://twitter.com/'+cr['SNS：Twitter'].replace('@','')});
    if(cr['SNS：other'])      ls.push({i:'🔗', l:'SNS：other',     u: cr['SNS：other']});
    if(ls.length){
      h += '<div class="cs"><div class="csh">リンク</div><div class="links">';
      ls.forEach(function(lk){ h += '<a class="lnk" href="'+lk.u+'" target="_blank" rel="noopener"><span class="lnk-i">'+lk.i+'</span>'+lk.l+'</a>'; });
      h += '</div></div>';
    }
  } else {
    h = '<div style="text-align:center;padding:40px;color:#aaa"><div style="font-size:48px;margin-bottom:12px">🚪</div><p>現在入居者募集中</p></div>';
  }
  document.getElementById('creator-content').innerHTML = h;
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('mclose').addEventListener('click', function(){ document.getElementById('overlay').classList.remove('open'); });
document.getElementById('overlay').addEventListener('click', function(e){ if(e.target===document.getElementById('overlay')) document.getElementById('overlay').classList.remove('open'); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape') document.getElementById('overlay').classList.remove('open'); });

})();
</script>
</body>
</html>
